[project]
name = "everybodycodes"
version = "0.1.0"
description = "My solutions to the Everybody Codes puzzles."
readme = "README.md"
authors = [
    { name = "Baptiste Cottier", email = "baptiste.cottier@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "parse>=1.22.0",
    "pycryptodome>=3.23.0",
    "requests>=2.34.2",
    "sympy>=1.14.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
